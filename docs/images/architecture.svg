<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" width="100%" font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif'>
  <title>StepperMotorControl 分层架构</title>
  <desc>界面层经业务层调用 VSMD 驱动控制步进电机，并通过 INI/事件与测风采集软件联动。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="32" font-size="16" font-weight="500" fill="#2C2C2A">StepperMotorControl 分层架构</text>
  <rect x="40" y="56" width="600" height="76" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="48" y="94.0" font-size="12" fill="#185FA5" dominant-baseline="central">界面层</text>
  <rect x="152" y="72" width="149" height="44" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="226" y="94.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">motor_gui.ui</text>
  <rect x="313" y="72" width="149" height="44" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="387" y="94.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">主题/QSS</text>
  <rect x="473" y="72" width="149" height="44" rx="8" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="548" y="94.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">表盘/托盘</text>
  <line x1="340.0" y1="132" x2="340.0" y2="148" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="148" width="600" height="76" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="48" y="186.0" font-size="12" fill="#0F6E56" dominant-baseline="central">业务层</text>
  <rect x="152" y="164" width="108" height="44" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="206" y="186.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">time_counter</text>
  <rect x="272" y="164" width="108" height="44" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="327" y="186.0" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">scan/search_north</text>
  <rect x="393" y="164" width="108" height="44" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="447" y="186.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">齿轮比切换</text>
  <rect x="514" y="164" width="108" height="44" rx="8" fill="#ffffff" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="568" y="186.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">日志与配置</text>
  <line x1="340.0" y1="224" x2="340.0" y2="240" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="240" width="600" height="76" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="48" y="278.0" font-size="12" fill="#534AB7" dominant-baseline="central">驱动层</text>
  <rect x="152" y="256" width="149" height="44" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="226" y="278.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">vsmdlib.h</text>
  <rect x="313" y="256" width="149" height="44" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="387" y="278.0" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Vsmd/VsmdDevice</text>
  <rect x="473" y="256" width="149" height="44" rx="8" fill="#ffffff" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="548" y="278.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">RS485 9600bps</text>
  <line x1="340.0" y1="316" x2="340.0" y2="332" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="332" width="600" height="76" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="48" y="370.0" font-size="12" fill="#5F5E5A" dominant-baseline="central">外部接口层</text>
  <rect x="152" y="348" width="108" height="44" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="206" y="370.0" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">WindSetting.ini</text>
  <rect x="272" y="348" width="108" height="44" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="327" y="370.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Win32 事件</text>
  <rect x="393" y="348" width="108" height="44" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="447" y="370.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">注册表自启</text>
  <rect x="514" y="348" width="108" height="44" rx="8" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="568" y="370.0" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">LogFile</text>
</svg>